[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groupware-sync-auth"
version = "0.1.0"
description = "OAuth helper for groupware-sync development (Microsoft 365 and Stalwart, device code flow)"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "keyring>=24",
    "typer>=0.12",
    "vobject>=0.9.7",
]

[project.scripts]
groupware-sync-auth = "groupware_sync_auth.cli:app"
groupware-sync-contacts = "groupware_sync_contacts.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/groupware_sync_auth", "src/groupware_sync_contacts", "src/groupware_sync"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests requiring Docker services (deselect with '-m \"not e2e\"')",
]
