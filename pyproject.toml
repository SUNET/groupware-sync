[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groupware-sync-auth"
version = "0.1.0"
description = "OAuth helper for groupware-sync development (Microsoft 365 and Stalwart, device code flow)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "keyring>=24",
    "typer>=0.12",
]

[project.scripts]
groupware-sync-auth = "groupware_sync_auth.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/groupware_sync_auth"]
